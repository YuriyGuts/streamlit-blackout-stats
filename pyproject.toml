[project]
name = "streamlit-blackout-stats"
version = "0.2.0"
description = "Streamlit app for visualizing power outage statistics. Uses Google Sheets as the data source."
authors = [{ name = "Yuriy Guts", email = "yuriy.guts@gmail.com" }]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35.0",
    "streamlit-bokeh>=3.6.0",
    "shillelagh[gsheetsapi]>=1.2.19",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.7.1",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
    "pytest>=8.2.1",
    "coverage>=7.5.3",
]

[tool.mypy]
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
exclude = [
    "tests/.*",
    "\\.venv/.*",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pyflakes
    "F",     # pycodestyle
    "I",     # isort
    "N",     # pep8-naming
    "D",     # pydocstyle
    "PL",    # pylint
    "UP",    # pyupgrade
    "INP",   # check missing __init__.py
    "B006",  # mutable-argument-default
]
extend-ignore = [
    # D100-D106: Ignore undocumented module, class, method, function, inner class.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106",
]
fixable = ["I", "D", "UP"]

[tool.ruff.lint.isort]
force-single-line = true
extra-standard-library = ["zoneinfo"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",         # Allow tests without docstrings
    "PLR2004",   # Allow magic numbers in tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackout_stats"]
