repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: make lint
        language: system
        types: [python]
        require_serial: true
      - id: lint-fix
        name: lint-fix
        entry: make lint-fix
        language: system
        types: [python]
        require_serial: true
      - id: typecheck
        name: typecheck
        entry: make typecheck
        language: system
        types: [python]
        require_serial: true
        verbose: true
        pass_filenames: false
